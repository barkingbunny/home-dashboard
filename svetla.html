<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0f17">
<title>Světla</title>
<link rel="stylesheet" href="style.css?v=7">
<style>
  /* Stránka se všemi světly; používá stejné jednotky (rem z viewportu) a posuvníky jako hlavní stránka. */
  .app.lights { display: flex; flex-direction: column; }
  .lp-head { display: flex; align-items: center; justify-content: space-between; height: 6.4rem; flex: none; margin-bottom: 1.2rem; }
  .lp-title { font-size: 3.4rem; font-weight: 500; padding-left: 0.8rem; white-space: nowrap; }
  .lp-title .note { display: inline; margin-left: 1.4rem; font-weight: 400; }
  .btn { display: flex; align-items: center; justify-content: center; height: 6.4rem; padding: 0 3rem; border-radius: 2rem;
         background: rgba(255, 255, 255, 0.16); font-size: 2.8rem; white-space: nowrap; }
  .btn:active { background: rgba(255, 255, 255, 0.32); }
  #groups { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .group { flex: 1 1 0; display: flex; flex-direction: column; margin-bottom: 1.2rem; padding: 1rem 1.2rem 1.2rem; }
  .group:last-child { margin-bottom: 0; }
  .g-head { display: flex; align-items: baseline; justify-content: space-between; font-size: 2.6rem; line-height: 3rem; font-weight: 500; padding: 0 0.4rem; }
  .g-head .note { font-weight: 400; }
  .sl-row { flex: 1; display: flex; margin-top: 0.8rem; min-height: 0; }
  .sl-row .lb { max-width: 13rem; }
  .sl-row .lb-label { white-space: normal; text-align: center; font-size: 1.9rem; line-height: 2.2rem; padding: 0 0.3rem; }
  .sl-row .lb-icon { width: 5rem; height: 5rem; }
  .sl-row .lb.all { background: rgba(255, 255, 255, 0.16); }
  .sl-row .lb.gone { opacity: 0.4; }
</style>
</head>
<body>
<div class="app lights" id="app">
  <div class="lp-head">
    <div class="lp-title">Světla<span class="note" id="status"></span></div>
    <div class="btn" id="home">← Domů</div>
  </div>
  <div id="groups"></div>
</div>

<script src="icons.js?v=7"></script>
<script src="hue.js?v=7"></script>
<script>
// Každé světlo je svislý posuvník: ťuknutí zapne/vypne, tažení nastaví jas 0–100 %.
// Místnost s více světly má navíc posuvník „Vše“; místnosti s jedním světlem a zóny jsou
// společně v dlaždici „Další“. ?demo=1 = vymyšlená světla, bridge se nevolá.
(function () {
  'use strict';
  var REFRESH = 5000, IDLE = 5 * 60 * 1000, WAKE_GAP = 5000, CHECK_TIMEOUT = 10000, RETRY = 60 * 1000;
  var DEMO = new URLSearchParams(location.search).get('demo') === '1';
  if (DEMO) Hue.demo();

  var data = null, shown = '', busy = false, hold = 0, sliders = null, dragSender = null;
  var lastActivity = Date.now(), lastTick = Date.now(), lastLoad = 0, lastHomeTry = 0, homePending = false, homeChecking = false;

  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function status(text, warn) { var el = $('status'); el.textContent = text; el.className = 'note' + (warn ? ' warn' : ''); }
  function idleText() { return DEMO ? 'ukázková data' : ''; }

  function group(id) { return data.groups.filter(function (g) { return g.id === id; })[0]; }
  // → {ids: světla, kterých se prvek týká, level: aktuální jas 0–1, on, reachable}
  function target(kind, id) {
    if (kind === 'group') {
      var g = group(id);
      return g ? { ids: g.lights, level: g.anyOn ? g.bri / 254 : 0, on: g.anyOn, reachable: g.reachable } : null;
    }
    var l = data.lights[id];
    return l ? { ids: [id], level: l.on ? (l.bri === null ? 1 : l.bri / 254) : 0, on: l.on, reachable: l.reachable } : null;
  }

  function slider(kind, id, label, extra) {
    var t = target(kind, id);
    return '<div class="lb' + (t.on ? ' active' : '') + (t.reachable ? '' : ' gone') + (extra ? ' ' + extra : '') + '" data-act="' + kind + '" data-id="' + id + '">' +
      '<div class="lb-fill" style="height:' + Math.round(t.level * 100) + '%"></div>' +
      '<div class="lb-pct">' + (t.on ? Hue.levelText(t.level) : '') + '</div>' +
      '<div class="lb-icon">' + Icons.svg(t.on ? 'zarovka-on' : 'zarovka') + '</div>' +
      '<div class="lb-label">' + esc(label) + '</div></div>';
  }

  function render() {
    if (!data || (sliders && sliders.dragging())) return;
    var html = '', rest = '';
    data.groups.forEach(function (g) {
      if (!g.lights.length) return;
      if (g.type === 'Room' && g.lights.length > 1) {
        html += '<div class="tile group"><div class="g-head"><span>' + esc(g.name) + '</span><span class="note">' + (g.anyOn ? 'svítí' : 'nesvítí') + '</span></div>' +
          '<div class="sl-row">' + slider('group', g.id, 'Vše', 'all') +
          g.lights.map(function (id) { return data.lights[id] ? slider('light', id, data.lights[id].name) : ''; }).join('') + '</div></div>';
      } else {
        rest += slider('group', g.id, g.name + (g.type === 'Zone' ? ' (zóna)' : ''));
      }
    });
    if (rest) html += '<div class="tile group"><div class="g-head"><span>Další</span></div><div class="sl-row">' + rest + '</div></div>';
    if (html !== shown) { shown = html; $('groups').innerHTML = html; }
  }

  function load() {
    lastLoad = Date.now();
    if (data && (Date.now() < hold || (dragSender && dragSender.active()))) return;   // během posílání nečíst starý stav
    Hue.snapshot().then(function (d) { data = d; if (!busy) status(idleText(), false); render(); },
      function (e) { status(String(e.message || e), true); });
  }

  // ťuknutí = zapnout / vypnout (při zapnutí si světlo vezme svůj poslední jas)
  function tap(el) {
    var kind = el.getAttribute('data-act'), id = el.getAttribute('data-id'), t = data && target(kind, id);
    if (!t || busy) return;
    var on = !t.on;
    busy = true; hold = Date.now() + 2000; status('posílám…', false);
    (kind === 'group' ? Hue.setGroup(id, on) : Hue.setLight(id, on)).then(function () {
      busy = false;
      Hue.patchLights(data, t.ids, { on: on });
      status(idleText(), false); render();
      hold = Date.now() + 800; setTimeout(load, 900);
    }, function (e) { busy = false; status(String(e.message || e), true); });
  }

  function sender(kind, id) {
    return Hue.LatestSender(function (level) { return kind === 'group' ? Hue.setGroupLevel(id, level) : Hue.setLightLevel(id, level); }, 600);
  }
  function move(el, level) {
    if (!dragSender) dragSender = sender(el.getAttribute('data-act'), el.getAttribute('data-id'));
    hold = Date.now() + 3000;
    dragSender.push(level);
  }
  function end(el, level) {
    var kind = el.getAttribute('data-act'), id = el.getAttribute('data-id');
    var s = dragSender || sender(kind, id), t = data && target(kind, id);
    dragSender = null;
    s.push(level);
    if (t) Hue.patchLights(data, t.ids, Hue.levelBody(level));   // hned ukázat nový stav
    shown = ''; hold = Date.now() + 3000;
    render();
    s.idle(function (err) {
      if (err) status(String(err.message || err), true);
      hold = Date.now() + 1000; setTimeout(load, 1100);
    });
  }

  sliders = Hue.bindSliders($('groups'), { tap: tap, move: move, end: end, cancel: function () { dragSender = null; shown = ''; render(); } });

  // Návrat domů: tlačítkem nebo po 5 minutách nečinnosti. Odchází se jen na dostupný cíl
  // (chybová stránka kiosku by na tabletu zůstala viset); jinak se to zkusí znovu po probuzení.
  function goHome() {
    if (homeChecking) return;
    homeChecking = true; lastHomeTry = Date.now();
    var ac = new AbortController(), timer = setTimeout(function () { ac.abort(); }, CHECK_TIMEOUT);
    fetch('version.json?t=' + Date.now(), { cache: 'no-store', signal: ac.signal }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    }).then(function () { clearTimeout(timer); location.href = './'; }, function () {
      clearTimeout(timer); homeChecking = false; homePending = true;
      $('home').textContent = 'Domů – bez spojení';
    });
  }
  function homeIfDue(force) {
    var idle = Date.now() - lastActivity >= IDLE;
    if ((homePending || idle) && (force || Date.now() - lastHomeTry >= RETRY)) goHome();
  }
  $('home').addEventListener('click', goHome);

  ['pointerdown', 'touchstart', 'keydown', 'wheel'].forEach(function (n) {
    document.addEventListener(n, function () { lastActivity = Date.now(); }, { passive: true, capture: true });
  });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  setInterval(function () {
    var now = Date.now(), woke = now - lastTick > WAKE_GAP;
    lastTick = now;
    if (document.hidden) return;
    homeIfDue(woke);
    if (woke || now - lastLoad >= REFRESH) load();
  }, 1000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { homeIfDue(true); load(); } });
  window.addEventListener('online', function () { homeIfDue(true); load(); });

  if (!Hue.configured()) status('světla nejsou nastavena', true);
  else load();
})();
</script>
</body>
</html>
